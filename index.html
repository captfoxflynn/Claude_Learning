<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Claude Learning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="A beginner training course covering prompting, Cowork, and agents.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Claude Learning',
      repo: 'https://github.com/captfoxflynn/Claude_Learning',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      search: {
        placeholder: 'Search',
        noData: 'No results',
        depth: 3
      },
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script>
    var pageTitles = {
      '#/': 'Claude Learning',
      '#/README': 'Claude Learning',
      '#/01-prompting/': 'Module 1: Writing Clear, Effective Prompts · Claude Learning',
      '#/02-cowork/': 'Module 2: Getting Started with Cowork · Claude Learning',
      '#/03-agents/': 'Module 3: Introduction to Agents · Claude Learning',
      '#/about': 'About Me · Claude Learning'
    };
    function fixTitle() {
      var hash = location.hash || '#/';
      var wanted = pageTitles[hash];
      setTimeout(function () {
        if (wanted) {
          document.title = wanted;
        } else {
          var h1 = document.querySelector('.markdown-section h1');
          document.title = (h1 ? h1.textContent.trim() + ' · ' : '') + 'Claude Learning';
        }
      }, 300);
    }
    window.addEventListener('hashchange', fixTitle);
    window.addEventListener('load', fixTitle);
  </script>
</body>
</html>
